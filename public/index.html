<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#be185d">
  <meta name="description" content="A playful menu study game for Tia Juanita's.">
  <title>Lilah Flashcards for Tia Juanita's</title>
  <style>
    :root {
      color-scheme: light;
      --blush: #fdf2f8;
      --pink: #ec4899;
      --magenta: #be185d;
      --berry: #831843;
      --ink: #4a1730;
      --muted: #8b5b70;
      --white: #fffafd;
      --line: rgba(190, 24, 93, 0.16);
      --shadow: 0 24px 60px rgba(131, 24, 67, 0.18), 0 6px 18px rgba(131, 24, 67, 0.10);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 12% 12%, rgba(244, 114, 182, 0.23), transparent 28rem),
        radial-gradient(circle at 88% 85%, rgba(190, 24, 93, 0.13), transparent 26rem),
        var(--blush);
      color: var(--ink);
      font-family: Inter, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button, input { font: inherit; }

    button { -webkit-tap-highlight-color: transparent; }

    .app {
      width: min(100%, 58rem);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) clamp(1rem, 4vw, 2rem) max(1rem, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
      gap: clamp(0.7rem, 2vh, 1.1rem);
    }

    .masthead { text-align: center; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.35rem;
      color: var(--magenta);
      font-size: clamp(0.68rem, 2vw, 0.78rem);
      font-weight: 850;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 1.2rem;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      opacity: 0.5;
    }

    h1 {
      margin: 0;
      color: var(--berry);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 5vw, 2.55rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: min(100%, 36rem);
      margin: 0 auto;
    }

    .progress-track {
      flex: 1;
      height: 0.45rem;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(190, 24, 93, 0.12);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), var(--magenta));
      transition: width 300ms ease;
    }

    .counter {
      min-width: 4.4rem;
      color: var(--magenta);
      font-size: 0.78rem;
      font-weight: 800;
      text-align: right;
    }

    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.3rem;
      width: min(100%, 58rem);
      margin: 0 auto;
      padding: 0.28rem;
      border: 1px solid var(--line);
      border-radius: 1.2rem;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 4px 16px rgba(131, 24, 67, 0.06);
    }

    .section-button {
      flex: 0 0 auto;
      min-width: 0;
      border: 0;
      border-radius: 999px;
      padding: 0.58rem 0.5rem;
      background: transparent;
      color: var(--muted);
      font-size: clamp(0.7rem, 2.3vw, 0.82rem);
      font-weight: 850;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .section-button[aria-selected="true"] {
      background: linear-gradient(145deg, var(--pink), var(--magenta));
      box-shadow: 0 5px 12px rgba(190, 24, 93, 0.22);
      color: white;
    }

    .section-button:focus-visible { outline: 3px solid rgba(236,72,153,.3); outline-offset: 2px; }

    .study-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      width: min(100%, 48rem);
      margin: 0 auto;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      min-height: 2.35rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.48rem 0.78rem;
      background: rgba(255,255,255,.76);
      color: var(--berry);
      font-size: 0.74rem;
      font-weight: 850;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .tool-button:hover { transform: translateY(-1px); }
    .tool-button:focus-visible { outline: 3px solid rgba(236,72,153,.3); outline-offset: 2px; }

    .shuffle-button {
      border-color: transparent;
      background: var(--berry);
      color: white;
    }

    .tool-state {
      padding: 0.12rem 0.38rem;
      border-radius: 999px;
      background: #fce7f3;
      color: var(--magenta);
      font-size: 0.63rem;
      text-transform: uppercase;
    }

    .tool-button[aria-pressed="false"] { color: var(--muted); background: rgba(255,255,255,.42); }
    .tool-button[aria-pressed="false"] .tool-state { background: #eadde3; color: #765767; }

    .hide-prices .base-price,
    .hide-prices .price-context,
    .hide-prices .back-price,
    .hide-prices .total-label,
    .hide-prices .total-price,
    .hide-prices .addon-price { display: none; }
    .hide-descriptions .description { display: none; }
    .hide-sides .side-detail { display: none; }
    .hide-addons .addons-label,
    .hide-addons .addons { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      perspective: 1200px;
      touch-action: pan-y;
    }

    .card {
      position: relative;
      width: min(100%, 36rem);
      height: clamp(25rem, 57svh, 35rem);
      max-height: 100%;
      border: 0;
      padding: 0;
      border-radius: clamp(1.4rem, 4vw, 2rem);
      background: transparent;
      cursor: pointer;
      perspective: inherit;
      text-align: left;
      user-select: none;
    }

    .card:focus-visible { outline: 4px solid rgba(236, 72, 153, 0.35); outline-offset: 5px; }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 560ms cubic-bezier(.2,.72,.22,1);
    }

    .card.is-flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: inherit;
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-front {
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 6vw, 3.5rem);
      background:
        linear-gradient(145deg, rgba(255,255,255,0.86), rgba(253,242,248,0.8)),
        var(--white);
      text-align: center;
    }

    .card-front::before,
    .card-front::after {
      content: "✦";
      position: absolute;
      color: var(--pink);
      opacity: 0.16;
      font-size: clamp(6rem, 20vw, 10rem);
      line-height: 1;
    }

    .card-front::before { top: -2rem; right: -1rem; }
    .card-front::after { bottom: -2.2rem; left: -0.8rem; transform: rotate(30deg); }

    .front-content { position: relative; z-index: 1; }

    .dish-number {
      display: inline-grid;
      place-items: center;
      width: 3rem;
      aspect-ratio: 1;
      margin-bottom: clamp(1rem, 3vh, 1.8rem);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--pink), var(--magenta));
      box-shadow: 0 8px 20px rgba(190, 24, 93, 0.22);
      color: white;
      font-weight: 900;
    }

    .dish-name {
      max-width: 12em;
      margin: 0 auto 0.8rem;
      color: var(--berry);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.35rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .base-price {
      margin: 0;
      color: var(--magenta);
      font-size: clamp(1.35rem, 4vw, 1.85rem);
      font-weight: 900;
    }

    .price-context {
      display: block;
      min-height: 1.1em;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 750;
    }

    .flip-hint {
      position: absolute;
      left: 50%;
      bottom: clamp(1.2rem, 3vh, 1.8rem);
      z-index: 1;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
    }

    .flip-icon { font-size: 1.1rem; }

    .card-back {
      display: flex;
      flex-direction: column;
      gap: clamp(0.7rem, 2vh, 1rem);
      padding: clamp(1.25rem, 4vw, 2rem);
      transform: rotateY(180deg);
      background: linear-gradient(155deg, #fffafd 0%, #fce7f3 100%);
    }

    .back-kicker {
      margin: 0;
      color: var(--magenta);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .back-title {
      margin: 0.18rem 0 0;
      color: var(--berry);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.35rem, 4vw, 2rem);
      line-height: 1.08;
      letter-spacing: -0.025em;
    }

    .back-price {
      display: block;
      margin-top: 0.38rem;
      color: var(--magenta);
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 900;
    }

    .description {
      margin: 0;
      color: #65364a;
      font-size: clamp(0.82rem, 2.3vw, 0.98rem);
      line-height: 1.52;
    }

    .side-detail {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 0.9rem;
      background: rgba(255,255,255,0.6);
      color: var(--berry);
      font-size: clamp(0.76rem, 2.2vw, 0.88rem);
      font-weight: 700;
    }

    .side-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 1.8rem;
      aspect-ratio: 1;
      border-radius: 0.55rem;
      background: #fce7f3;
    }

    .addons-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .addons {
      display: grid;
      gap: 0.5rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(190,24,93,.25) transparent;
    }

    .addon {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.62rem 0.72rem;
      border-radius: 0.9rem;
      background: rgba(255,255,255,0.76);
      cursor: pointer;
    }

    .addon-copy { flex: 1; min-width: 0; }

    .addon-name {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-size: clamp(0.75rem, 2.1vw, 0.87rem);
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .addon-price {
      display: block;
      margin-top: 0.08rem;
      color: var(--magenta);
      font-size: 0.72rem;
      font-weight: 850;
    }

    .switch-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 2.65rem;
      height: 1.5rem;
      border-radius: 999px;
      background: #e8cbd8;
      box-shadow: inset 0 1px 3px rgba(74,23,48,.15);
      transition: background 180ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 0.2rem;
      left: 0.2rem;
      width: 1.1rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 5px rgba(74,23,48,.25);
      transition: transform 180ms ease;
    }

    .switch-input:checked + .switch { background: var(--pink); }
    .switch-input:checked + .switch::after { transform: translateX(1.15rem); }
    .switch-input:focus-visible + .switch { outline: 3px solid rgba(236,72,153,.32); outline-offset: 2px; }

    .total-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin-top: auto;
      padding-top: 0.8rem;
      border-top: 1px solid var(--line);
    }

    .total-label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .total-price {
      display: block;
      margin-top: 0.1rem;
      color: var(--berry);
      font-size: clamp(1.55rem, 5vw, 2.15rem);
      font-weight: 950;
      letter-spacing: -0.04em;
    }

    .back-hint {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 650;
      text-align: right;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      width: min(100%, 36rem);
      margin: 0 auto;
    }

    .nav-button {
      min-height: 3rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      box-shadow: 0 5px 16px rgba(131,24,67,.08);
      color: var(--magenta);
      font-weight: 850;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, color 160ms ease;
    }

    .nav-button:hover { transform: translateY(-2px); background: var(--magenta); color: white; }
    .nav-button:active { transform: translateY(0); }
    .nav-button:focus-visible { outline: 3px solid rgba(236,72,153,.3); outline-offset: 2px; }

    .swipe-note {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 650;
      text-align: center;
      white-space: nowrap;
    }

    @media (max-height: 680px) {
      .app { gap: 0.5rem; }
      .eyebrow { display: none; }
      .card { height: min(61svh, 27rem); }
      .card-back { gap: 0.5rem; padding: 1rem 1.2rem; }
      .description { line-height: 1.4; }
      .side-detail, .addon { padding-block: 0.48rem; }
      .total-row { padding-top: 0.5rem; }
    }

    @media (max-width: 640px) {
      .section-tabs {
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        border-radius: 999px;
        scrollbar-width: thin;
        scrollbar-color: rgba(190,24,93,.35) transparent;
        scroll-snap-type: x proximity;
      }
      .section-button { scroll-snap-align: start; }
      .study-tools { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
      .study-tools::-webkit-scrollbar { display: none; }
    }

    @media (max-width: 380px) {
      .app { padding-inline: 0.8rem; }
      .card { height: min(64svh, 31rem); }
      .card-back { padding: 1rem; }
      .swipe-note { display: none; }
      .controls { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <p class="eyebrow">Menu Study Game</p>
      <h1>Lilah Flashcards for Tia Juanita's</h1>
    </header>

    <div class="progress-row" aria-label="Flashcard progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="counter" id="counter">1 of 130</span>
    </div>

    <div class="section-tabs" role="tablist" aria-label="Menu sections">
      <button class="section-button" type="button" role="tab" aria-selected="true" data-section="All">All Cards</button>
    </div>

    <div class="study-tools" aria-label="Study controls">
      <button class="tool-button shuffle-button" id="shuffleButton" type="button"><span aria-hidden="true">⤨</span> Randomize</button>
      <button class="tool-button setting-button" type="button" data-setting="prices" aria-pressed="true">Prices <span class="tool-state">On</span></button>
      <button class="tool-button setting-button" type="button" data-setting="descriptions" aria-pressed="true">Descriptions <span class="tool-state">On</span></button>
      <button class="tool-button setting-button" type="button" data-setting="sides" aria-pressed="true">Sides <span class="tool-state">On</span></button>
      <button class="tool-button setting-button" type="button" data-setting="addons" aria-pressed="true">Add-ons <span class="tool-state">On</span></button>
      <span class="sr-only" id="shuffleStatus" aria-live="polite"></span>
    </div>

    <section class="stage" aria-live="polite">
      <div class="card" id="card" role="button" tabindex="0" aria-label="Flip flashcard" aria-pressed="false">
        <span class="card-inner">
          <span class="card-face card-front">
            <span class="front-content">
              <span class="dish-number" id="dishNumber">01</span>
              <span class="dish-name" id="dishName"></span>
              <span class="base-price" id="basePrice"></span>
              <span class="price-context" id="priceContext"></span>
            </span>
            <span class="flip-hint"><span class="flip-icon" aria-hidden="true">↻</span> Tap to flip</span>
          </span>

          <span class="card-face card-back">
            <span>
              <span class="back-kicker">The details</span>
              <span class="back-title" id="backTitle"></span>
              <span class="back-price" id="backPrice"></span>
            </span>
            <span class="description" id="description"></span>
            <span class="side-detail"><span class="side-icon" aria-hidden="true">✦</span><span><strong>Side:</strong> <span id="side"></span></span></span>
            <span class="addons-label" id="addonsLabel">Make it yours</span>
            <span class="addons" id="addons"></span>
            <span class="total-row">
              <span><span class="total-label">Your total</span><span class="total-price" id="totalPrice"></span></span>
              <span class="back-hint">Tap blank space<br>to flip back</span>
            </span>
          </span>
        </span>
      </div>
    </section>

    <nav class="controls" aria-label="Flashcard navigation">
      <button class="nav-button" id="previousButton" type="button" aria-label="Previous dish">← Previous</button>
      <span class="swipe-note">Swipe to browse</span>
      <button class="nav-button" id="nextButton" type="button" aria-label="Next dish">Next →</button>
    </nav>
  </main>

      cardItem("Side Salsa", "Extras", 1.49, "Tia's house salsa.", "Choose a size", [], priceChoices(["Side · 4 oz", 1.49], ["Pint · 16 oz", 6.99])),
      cardItem("Fried Whole Jalapeño", "Extras", 1.29, "A whole jalapeño fried until blistered."),
      cardItem("Side Pico de Gallo", "Extras", 1.99, "A side of fresh pico de gallo."),
      cardItem("Charro Beans", "Extras", 2.99, "Tia's savory charro beans.", "Choose a size", [], priceChoices(["Cup", 2.99], ["Small Bowl", 4.49])),
      cardItem("Side of Guacamole", "Extras", 2.99, "A side of freshly mashed guacamole."),
      cardItem("Side of Sliced Avocado", "Extras", 2.99, "A side of fresh sliced avocado."),
      cardItem("Side of Mango Pico de Gallo", "Extras", 2.99, "A side of fresh mango-pineapple pico de gallo."),
      cardItem("Side of Fries", "Extras", 2.99, "A side of seasoned French fries."),
      cardItem("Baked Potato", "Extras", 3.99, "A baked potato with butter, sour cream, bacon, cheddar cheese, and green onions."),

      cardItem("Chicken Nuggets", "Kid's Menu", 7.99, "Chicken nuggets for kids 10 and under.", "Fries & kid's drink included"),
      cardItem("Popcorn Shrimp", "Kid's Menu", 7.99, "Popcorn shrimp for kids 10 and under. For gluten-free, substitute grilled shrimp and rice or potato salad with no hushpuppy.", "Fries, hushpuppy & kid's drink included"),
      cardItem("Fish Strips", "Kid's Menu", 7.99, "Fish strips for kids 10 and under. For gluten-free, substitute grilled fish and rice or potato salad with no hushpuppy.", "Fries, hushpuppy & kid's drink included"),
      cardItem("Meat & Cheese Taco", "Kid's Menu", 7.99, "A crispy taco shell with taco meat and cheddar jack cheese, served with a side of queso. Ground meat contains MSG.", "Fries & kid's drink included"),
      cardItem("French Fry Nachos", "Kid's Menu", 7.99, "French fries topped with taco meat, melted cheese, and queso.", "Kid's drink included"),

      cardItem("Family Taco Pack", "Family & Party Packs", 59.99, "Serves up to four. Choose twelve flour or corn tortillas with ground beef, or fish, shrimp, or roast beef, plus the matching toppings.", "1 quart rice, 1 quart charro beans & 1 pint jalapeño ranch"),
      cardItem("Family Fajita Pack (1.5 lb)", "Family & Party Packs", 85.99, "Serves up to four with your choice of fajita beef or chicken and the full family-size fajita fixings.", "Rice, charro beans, toppings, tortillas, chips & salsa"),
      cardItem("Family Seafood Pack", "Family & Party Packs", 75.99, "Sixteen jumbo fried shrimp, eight fried fish filets, eight fried oysters, twelve hushpuppies, and fries.", "Tartar & cocktail sauce available on request"),
      Object.assign(cardItem("Crawfish 20 Pounds (When Available)", "Family & Party Packs", 0, "Twenty pounds of mouthwatering spicy crawfish with one garlic clove, four corn, and eight potatoes.", "Seasonal availability", [{ label: "Extra Potato", price: 0.50 }, { label: "Extra Corn", price: 0.75 }, { label: "Zummo's Sausage Link", price: 3.50 }, { label: "Pink Sauce · 2 cups", price: 3.50 }, { label: "Melted Butter · 2 oz", price: 0.50 }, { label: "Crawfish Seasoning · 1 oz", price: 0.25 }]), { priceLabel: "Market Price" })
    );

    const card = document.getElementById("card");
    const dishNumber = document.getElementById("dishNumber");
    const dishName = document.getElementById("dishName");
    const basePrice = document.getElementById("basePrice");
    const priceContext = document.getElementById("priceContext");
    const backTitle = document.getElementById("backTitle");
    const backPrice = document.getElementById("backPrice");
    const description = document.getElementById("description");
    const side = document.getElementById("side");
    const addonsLabel = document.getElementById("addonsLabel");
    const addons = document.getElementById("addons");
    const totalPrice = document.getElementById("totalPrice");
    const counter = document.getElementById("counter");
    const progressFill = document.getElementById("progressFill");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const sectionTabs = document.querySelector(".section-tabs");
    const shuffleButton = document.getElementById("shuffleButton");
    const shuffleStatus = document.getElementById("shuffleStatus");
    const settingButtons = [...document.querySelectorAll(".setting-button")];

    let currentIndex = 0;
    let activeSection = "All";
    let cardOrder = menuItems.map((_, index) => index);
    let touchStartX = 0;
    let touchStartY = 0;
    let movedBySwipe = false;
    const selectedAddons = menuItems.map(() => new Set());
    const selectedPriceOptions = menuItems.map(() => 0);
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    function itemSection(item) {
      return item.section || "Food";
    }

    function visibleIndices() {
      return cardOrder.filter((index) => activeSection === "All" || itemSection(menuItems[index]) === activeSection);
    }

    function calculateTotal() {
      const item = menuItems[currentIndex];
      const startingPrice = item.priceOptions
        ? item.priceOptions[selectedPriceOptions[currentIndex]].price
        : item.basePrice;
      const extras = [...selectedAddons[currentIndex]].reduce((sum, addonIndex) => sum + item.addons[addonIndex].price, 0);
      if (item.priceLabel) {
        backPrice.textContent = item.priceLabel;
        totalPrice.textContent = extras ? `${item.priceLabel} + ${money.format(extras)}` : item.priceLabel;
        return;
      }
      backPrice.textContent = item.priceOptions
        ? `${item.priceOptions[selectedPriceOptions[currentIndex]].label} · ${money.format(startingPrice)}`
        : `Base price · ${money.format(startingPrice)}`;
      totalPrice.textContent = money.format(startingPrice + extras);
    }

    function makePriceOption(option, optionIndex) {
      const label = document.createElement("label");
      label.className = "addon";
      label.addEventListener("click", (event) => event.stopPropagation());

      const copy = document.createElement("span");
      copy.className = "addon-copy";
      const name = document.createElement("span");
      name.className = "addon-name";
      name.textContent = option.label;
      const price = document.createElement("span");
      price.className = "addon-price";
      price.textContent = money.format(option.price);
      copy.append(name, price);

      const input = document.createElement("input");
      input.className = "switch-input";
      input.type = "radio";
      input.name = `price-${currentIndex}`;
      input.checked = selectedPriceOptions[currentIndex] === optionIndex;
      input.setAttribute("aria-label", `${option.label}, ${money.format(option.price)}`);
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("change", (event) => {
        event.stopPropagation();
        selectedPriceOptions[currentIndex] = optionIndex;
        calculateTotal();
      });

      const toggle = document.createElement("span");
      toggle.className = "switch";
      toggle.setAttribute("aria-hidden", "true");
      label.append(copy, input, toggle);
      return label;
    }

    function makeAddon(addon, addonIndex) {
      const label = document.createElement("label");
      label.className = "addon";
      label.addEventListener("click", (event) => event.stopPropagation());

      const copy = document.createElement("span");
      copy.className = "addon-copy";

      const name = document.createElement("span");
      name.className = "addon-name";
      name.textContent = addon.label;

      const price = document.createElement("span");
      price.className = "addon-price";
      price.textContent = `+${money.format(addon.price)}`;

      const input = document.createElement("input");
      input.className = "switch-input";
      input.type = "checkbox";
      input.checked = selectedAddons[currentIndex].has(addonIndex);
      input.setAttribute("aria-label", `${addon.label}, add ${money.format(addon.price)}`);
      input.addEventListener("click", (event) => event.stopPropagation());
      input.addEventListener("change", (event) => {
        event.stopPropagation();
        if (input.checked) selectedAddons[currentIndex].add(addonIndex);
        else selectedAddons[currentIndex].delete(addonIndex);
        calculateTotal();
      });

      const toggle = document.createElement("span");
      toggle.className = "switch";
      toggle.setAttribute("aria-hidden", "true");

      copy.append(name, price);
      label.append(copy, input, toggle);
      return label;
    }

    function renderCard() {
      const item = menuItems[currentIndex];
      card.classList.remove("is-flipped");
      card.setAttribute("aria-pressed", "false");
      dishName.textContent = item.name;
      const firstPrice = item.priceOptions ? item.priceOptions[0] : null;
      basePrice.textContent = item.priceLabel || (firstPrice
        ? `${firstPrice.label} ${money.format(firstPrice.price)}`
        : money.format(item.basePrice));
      priceContext.textContent = item.priceLabel
        ? "Ask for today's price"
        : item.priceOptions && item.priceOptions.length > 1
        ? item.priceOptions.slice(1).map((option) => `${option.label} ${money.format(option.price)}`).join(" • ")
        : "Base price";
      backTitle.textContent = item.name;
      description.textContent = item.desc;
      side.textContent = item.side;
      const hasChoices = Boolean(item.priceOptions || item.addons.length);
      addonsLabel.hidden = !hasChoices;
      addons.hidden = !hasChoices;
      addonsLabel.textContent = item.priceOptions && item.addons.length
        ? "Choose your price & extras"
        : item.priceOptions ? "Choose your price" : "Make it yours";
      const choices = item.priceOptions ? item.priceOptions.map(makePriceOption) : [];
      const extras = item.addons.map(makeAddon);
      addons.replaceChildren(...choices, ...extras);
      const visible = visibleIndices();
      const position = visible.indexOf(currentIndex);
      dishNumber.textContent = String(position + 1).padStart(2, "0");
      counter.textContent = `${position + 1} of ${visible.length}`;
      progressFill.style.width = `${((position + 1) / visible.length) * 100}%`;
      calculateTotal();
    }

    function flipCard() {
      if (movedBySwipe) return;
      const isFlipped = card.classList.toggle("is-flipped");
      card.setAttribute("aria-pressed", String(isFlipped));
    }

    function changeCard(direction) {
      const visible = visibleIndices();
      const position = visible.indexOf(currentIndex);
      currentIndex = visible[(position + direction + visible.length) % visible.length];
      renderCard();
    }

    function changeSection(section) {
      activeSection = section;
      document.querySelectorAll(".section-button").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.section === activeSection));
      });
      currentIndex = visibleIndices()[0];
      renderCard();
    }

    function randomizeCards() {
      for (let index = cardOrder.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [cardOrder[index], cardOrder[randomIndex]] = [cardOrder[randomIndex], cardOrder[index]];
      }
      const visible = visibleIndices();
      currentIndex = visible[0];
      renderCard();
      shuffleStatus.textContent = `${visible.length} ${activeSection === "All" ? "cards" : `${activeSection} cards`} randomized.`;
    }

    function toggleStudySetting(button) {
      const setting = button.dataset.setting;
      const isOn = button.getAttribute("aria-pressed") === "true";
      button.setAttribute("aria-pressed", String(!isOn));
      button.querySelector(".tool-state").textContent = isOn ? "Off" : "On";
      document.body.classList.toggle(`hide-${setting}`, isOn);
    }

    function renderSectionButtons() {
      const available = new Set(menuItems.map(itemSection));
      const sectionOrder = ["Starters", "Salads", "Gumbo", "Oysters", "Mexicajun", "Tacos", "Fajitas", "Po' Boys", "Po' Boy Combos", "Seafood Baskets", "Boiled Seafood", "Grilled Plates", "Specialties", "Beverages", "Desserts", "Extras", "Kid's Menu", "Family & Party Packs", "Margaritas"];
      const sections = sectionOrder.filter((section) => available.has(section));
      sections.forEach((section) => {
        const button = document.createElement("button");
        button.className = "section-button";
        button.type = "button";
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", "false");
        button.dataset.section = section;
        button.textContent = section;
        sectionTabs.append(button);
      });
      sectionTabs.addEventListener("click", (event) => {
        const button = event.target.closest(".section-button");
        if (button) changeSection(button.dataset.section);
      });
    }

    card.addEventListener("click", flipCard);
    card.addEventListener("keydown", (event) => {
      if (event.target.matches("input")) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        flipCard();
      }
    });
    previousButton.addEventListener("click", () => changeCard(-1));
    nextButton.addEventListener("click", () => changeCard(1));
    shuffleButton.addEventListener("click", randomizeCards);
    settingButtons.forEach((button) => button.addEventListener("click", () => toggleStudySetting(button)));

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input")) return;
      if (event.key === "ArrowLeft") changeCard(-1);
      if (event.key === "ArrowRight") changeCard(1);
    });

    card.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
      touchStartY = event.changedTouches[0].clientY;
      movedBySwipe = false;
    }, { passive: true });

    card.addEventListener("touchend", (event) => {
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      const deltaY = event.changedTouches[0].clientY - touchStartY;
      if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.25) {
        movedBySwipe = true;
        changeCard(deltaX < 0 ? 1 : -1);
        window.setTimeout(() => { movedBySwipe = false; }, 0);
      }
    }, { passive: true });

    renderSectionButtons();
    renderCard();
  </script>
</body>
</html>
